<svg width="900" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
    .mono { font-family: 'Share Tech Mono', 'Courier New', monospace; }
    .blink { animation: blink 1.1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { animation: fd 0.7s ease both; }
    .fade1 { animation: fd 0.7s ease 0.1s both; }
    .fade2 { animation: fd 0.7s ease 0.3s both; }
    .fade3 { animation: fd 0.7s ease 0.5s both; }
    .fade4 { animation: fd 0.7s ease 0.7s both; }
    @keyframes fd { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <!-- background -->
  <rect width="900" height="110" fill="#080c08" rx="6"/>

  <!-- outer glow border -->
  <rect x="1" y="1" width="898" height="108" fill="none" stroke="#22cc22" stroke-width="1.2" rx="6" opacity="0.6"/>

  <!-- scanlines -->
  <rect width="900" height="110" fill="url(#scan)" rx="6" opacity="0.4"/>
  <defs>
    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="transparent"/>
      <rect y="2" width="1" height="2" fill="rgba(0,255,0,0.015)"/>
    </pattern>
  </defs>

  <!-- box border -->
  <rect x="30" y="14" width="840" height="82" fill="#060e06" stroke="#1a4a1a" stroke-width="1" rx="3" class="fade"/>

  <!-- corner chars -->
  <text x="34" y="30" class="mono fade1" fill="#2a6a2a" font-size="13">┌</text>
  <text x="858" y="30" class="mono fade1" fill="#2a6a2a" font-size="13" text-anchor="end">┐</text>
  <text x="34" y="91" class="mono fade4" fill="#2a6a2a" font-size="13">└</text>
  <text x="858" y="91" class="mono fade4" fill="#2a6a2a" font-size="13" text-anchor="end">┘</text>

  <!-- side bars -->
  <text x="34" y="52" class="mono fade2" fill="#2a6a2a" font-size="13">│</text>
  <text x="858" y="52" class="mono fade2" fill="#2a6a2a" font-size="13" text-anchor="end">│</text>
  <text x="34" y="72" class="mono fade3" fill="#2a6a2a" font-size="13">│</text>
  <text x="858" y="72" class="mono fade3" fill="#2a6a2a" font-size="13" text-anchor="end">│</text>

  <!-- row 1 -->
  <text x="52" y="52" class="mono fade2" font-size="13">
    <tspan fill="#ffff55">⚡</tspan>
    <tspan fill="#aaffaa"> Full-Stack Developer</tspan>
    <tspan fill="#2a6a2a">  │  </tspan>
    <tspan fill="#ccffcc">building things that matter</tspan>
  </text>

  <!-- row 2 -->
  <text x="52" y="72" class="mono fade3" font-size="13">
    <tspan fill="#44ffee">📍</tspan>
    <tspan fill="#88ccaa"> India</tspan>
    <tspan fill="#2a6a2a">  •  </tspan>
    <tspan fill="#88ccaa">open to collabs &amp; opportunities</tspan>
  </text>

  <!-- row 3 -->
  <text x="52" y="91" class="mono fade4" font-size="13">
    <tspan fill="#557755">✉</tspan>
    <tspan fill="#44ffee">  khushibha05@gmail.com</tspan>
  </text>

</svg>
