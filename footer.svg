<svg width="900" viewBox="0 0 900 70" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
    .mono { font-family: 'Share Tech Mono', 'Courier New', monospace; }
    .blink { animation: blink 1.1s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="900" height="70" fill="#080c08" rx="4"/>
  <text x="20" y="26" class="mono" font-size="13">
    <tspan fill="#33ff33">visitor@github:~$</tspan>
    <tspan fill="#aaffaa"> echo "thanks for visiting — let's build something cool"</tspan>
  </text>
  <text x="20" y="46" class="mono" font-size="13">
    <tspan fill="#3a6a3a">// output: </tspan>
    <tspan fill="#ffff55">"thanks for visiting — let's build something cool"</tspan>
  </text>
  <text x="20" y="64" class="mono" font-size="13">
    <tspan fill="#33ff33">visitor@github:~$</tspan>
    <tspan fill="#00ff88" class="blink"> █</tspan>
  </text>
</svg>
